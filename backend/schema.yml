          - vi
          - zh-hans
          - zh-hant
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /playlists/:
    get:
      operationId: playlists_list
      description: Returns all public playlists together with the authenticated user's
        private playlists. Results can be searched by name and optionally ordered
        by creation date.
      summary: List playlists
      parameters:
      - in: query
        name: filter
        schema:
          type: string
          enum:
          - newest
          - oldest
          - stream
        description: '''newest'' orders by newest first, ''oldest'' orders by oldest
          first, ''stream'' keeps the default ordering.'
      - in: query
        name: query
        schema:
          type: string
        description: Case-insensitive search by playlist name.
      tags:
      - playlists
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Playlists'
              examples:
                PlaylistList:
                  value:
                  - - id: 15
                      name: Workout Mix
                      owner: 3
                      cover_image: null
                      created_at: '2026-07-30T13:42:11Z'
                    - id: 7
                      name: Chill Vibes
                      owner: 8
                      cover_image: https://example.com/media/playlist_covers/chill.jpg
                      created_at: '2026-07-28T19:21:45Z'
                  summary: Playlist list
          description: ''
    post:
      operationId: playlists_create
      description: Creates a new playlist for the authenticated user. Only the playlist
        name is required. The owner is assigned automatically and the request fails
        if the user's subscription playlist limit has been reached.
      summary: Create playlist
      tags:
      - playlists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistsRequest'
            examples:
              CreatePlaylist:
                value:
                  name: Workout Mix
                summary: Create playlist
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlaylistsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlaylistsRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlists'
              examples:
                PlaylistCreated:
                  value:
                    id: 15
                    name: Workout Mix
                    owner: 3
                    cover_image: null
                    created_at: '2026-07-30T13:42:11Z'
                  summary: Playlist created
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistCreateError'
              examples:
                PlaylistLimitReached:
                  value:
                    non_field_errors:
                    - You can create at most 6 playlists with your current subscription.
                  summary: Playlist limit reached
          description: Validation error.
  /playlists/{id}/:
    get:
      operationId: playlists_retrieve
      description: Returns the complete information for a playlist owned by the authenticated
        user, including the IDs of all songs in playlist order.
      summary: Retrieve a playlist
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - playlists
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
              examples:
                PlaylistDetails:
                  value:
                    id: 15
                    name: Workout Mix
                    description: Songs for the gym.
                    owner: 3
                    is_private: true
                    cover_image: https://example.com/media/playlist_covers/workout.jpg
                    created_at: '2026-07-30T13:42:11Z'
                    songs:
                    - 4
                    - 18
                    - 27
                    - 35
                  summary: Playlist details
          description: ''
        '403':
          description: You do not have permission to access this playlist.
        '404':
          description: Playlist not found.
    put:
      operationId: playlists_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - playlists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlaylistDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlaylistDetailRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
          description: ''
    patch:
      operationId: playlists_partial_update
      description: Partially updates a playlist owned by the authenticated user. Only
        the provided fields are modified. Songs cannot be updated through this endpoint.
      summary: Update a playlist
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - playlists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlaylistDetailRequest'
            examples:
              UpdatePlaylist:
                value:
                  name: Morning Playlist
                  description: Perfect for commuting.
                  is_private: false
                summary: Update playlist
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPlaylistDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlaylistDetailRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
              examples:
                PlaylistUpdated:
                  value:
                    id: 15
                    name: Morning Playlist
                    description: Perfect for commuting.
                    owner: 3
                    is_private: false
                    cover_image: null
