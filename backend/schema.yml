components:
  schemas:
    AlbumCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 50
        description:
          type: string
          nullable: true
        is_single:
          type: boolean
        release_date:
          type: string
          format: date-time
        artist:
          type: integer
          readOnly: true
        cover_image:
          type: string
          format: uri
          nullable: true
      required:
      - artist
      - id
      - release_date
      - title
    AlbumCreateRequestRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Album title
        description:
          type: string
          nullable: true
        is_single:
          type: boolean
          default: false
        release_date:
          type: string
          format: date-time
          description: Release date in ISO-8601 format
        cover_image:
          type: string
          format: binary
          nullable: true
          description: Optional album cover image
      required:
      - release_date
      - title
    AlbumDetailModel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 50
        description:
          type: string
          nullable: true
        is_single:
          type: boolean
        release_date:
          type: string
          format: date-time
        artist:
          type: integer
          readOnly: true
        cover_image:
          type: string
          format: uri
          nullable: true
        songs:
          type: string
          readOnly: true
      required:
      - artist
      - id
      - release_date
      - songs
      - title
    AlbumList:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        artistName:
          type: string
          readOnly: true
        artistId:
          type: string
          readOnly: true
        listeners:
          type: string
          readOnly: true
        releaseDate:
          type: string
          format: date-time
        imageUrl:
          type: string
          readOnly: true
        description:
          type: string
          nullable: true
        songList:
          type: string
          readOnly: true
      required:
      - artistId
      - artistName
      - description
      - id
      - imageUrl
      - listeners
      - name
      - releaseDate
      - songList
    AlbumSong:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        artistName:
          type: string
          readOnly: true
        artistId:
          type: string
          readOnly: true
        albumName:
          type: string
          readOnly: true
        albumId:
          type: string
          readOnly: true
        streams:
          type: integer
        releaseDate:
          type: string
