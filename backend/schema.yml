        by title or artist display name and optionally ordered by release date or
        stream count.
      summary: List songs
      parameters:
      - in: query
        name: filter
        schema:
          type: string
          enum:
          - newest
          - oldest
          - streams
        description: '''newest'' orders by newest release date, ''oldest'' orders
          by oldest release date, ''streams'' orders by highest stream count.'
      - in: query
        name: query
        schema:
          type: string
        description: Case-insensitive search by song title or artist display name.
      tags:
      - songs
      security:
      - jwtAuth: []
