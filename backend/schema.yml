  /subscriptions/verify/:
    get:
      operationId: subscriptions_verify_retrieve
      description: Receives Zarinpal callback, performs server-side verify, updates
        subscription on success, and optionally redirects the browser back to the
        provided return URL.
      summary: Verify a subscription payment
      parameters:
      - in: query
        name: Authority
        schema:
          type: string
        description: Zarinpal Authority token returned after the payment request.
        required: true
      - in: query
        name: Status
        schema:
          type: string
        description: Payment result status returned by Zarinpal. Use OK for successful
          checkout return.
        required: true
      - in: query
        name: return_url
        schema:
          type: string
        description: Optional frontend URL to redirect to after verification.
      tags:
      - subscriptions
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionVerificationResponse'
          description: ''
        '302':
          description: Redirects to the provided return_url with result parameters.
        '400':
          description: Missing or invalid callback parameters.
        '404':
          description: Transaction with the requested authority could not be found.
