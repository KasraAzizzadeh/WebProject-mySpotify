openapi: 3.0.3
info:
  title: mySpotify Backend API
  version: 1.0.0
  description: Web Programming Project
paths:
  /accounts/{id}/:
    get:
      operationId: accounts_retrieve
      description: Returns public view of a user's profile or private view if requested
        by the owner.
      summary: Get user profile
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
          description: ''
    patch:
      operationId: accounts_partial_update
      description: 'Update the authenticated user''s profile. Allowed fields: display_name,
        email, password. If the user is an artist, artist_bio may also be provided
        to update the artist bio.'
      summary: Update own profile
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
          description: ''
    delete:
      operationId: accounts_destroy
      description: Deletes the authenticated user's account. The id in the path must
        match the authenticated user's id.
      summary: Delete own account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeleteResponse'
          description: ''
  /accounts/{id}/albums/:
    get:
      operationId: accounts_albums_list
      description: Returns published albums for an artist. Shape matches frontend
        AlbumItem as closely as possible.
      summary: Get user's albums
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAlbum'
          description: ''
  /accounts/{id}/follow/:
    post:
      operationId: accounts_follow_create
      description: Authenticated user follows the specified target user. Returns a
        success message on completion.
      summary: Follow a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowResponse'
          description: ''
    delete:
      operationId: accounts_follow_destroy
      description: Authenticated user unfollows the specified target user. Returns
        a success message on completion.
      summary: Unfollow a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnfollowResponse'
          description: ''
  /accounts/{id}/playlists/:
    get:
      operationId: accounts_playlists_list
      description: Returns playlists owned by the specified user.
      summary: Get user's playlists
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPlaylist'
          description: ''
  /accounts/{id}/songs/:
    get:
      operationId: accounts_songs_list
      description: Returns songs belonging to an artist. Uses a serializer shaped
        for frontend SongItem.
      summary: Get user's songs
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSong'
          description: ''
  /accounts/apply-as-artist/:
    post:
      operationId: accounts_apply_as_artist_create
      description: Submits an artist verification request together with sample audio
        files. A pending artist profile is created (or reset from rejected), support
        staff are notified, and the updated user is returned.
      summary: Apply as an artist
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitArtistApplicationRequest'
            examples:
              Request:
                value:
                  artistic_name: DJ Eclipse
                  samples:
                  - <audio file>
                  - <audio file>
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitArtistApplicationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitArtistApplicationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /accounts/login/:
    post:
      operationId: accounts_login_create
      description: Authenticates a user using their email and password, checks their
        subscription status, creates an expiration notification if necessary, and
        returns the authenticated user together with JWT access and refresh tokens.
      summary: Login
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              LoginRequest:
                value:
                  email: john@example.com
                  password: StrongPassword123!
                summary: Login request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                SuccessfulLogin:
                  value:
                    user:
                      id: 1
                      username: johndoe
                      display_name: johndoe_4821
                      email: john@example.com
                      role: listener
                      profile_picture: null
                      gender: MALE
                      birth_date: '2000-01-15'
                      subscription_type: basic
                      subscription_valid_until: null
                      followers:
                      - 3
                      - 5
                      following:
                      - 7
                      - 12
                      created_at: '2026-07-29T12:34:56Z'
                      settings:
                        language: en
                        system_voice: en-is
                        notification_limit: 10
                      listener_profile:
                        playlists:
                        - 4
                        - 8
                        recently_played:
                        - 21
                        - 15
                        - 8
                        liked_tracks: []
                        daily_streams: 6
                        last_stream_date: '2026-07-29T11:08:12Z'
                      artist_profile: {}
                    access: <jwt access token>
                    refresh: <jwt refresh token>
                  summary: Successful login
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
              examples:
                InvalidCredentials:
                  value:
                    detail: Invalid credentials
                  summary: Invalid credentials
          description: Authentication failed.
  /accounts/notifications/:
    get:
      operationId: accounts_notifications_list
      description: Returns notifications belonging to the authenticated user.
      summary: List notifications for current user
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /accounts/notifications/{id}/:
    patch:
      operationId: accounts_notifications_partial_update
      description: Marks the specified notification as read by setting its is_read
        field to true.
      summary: Mark notification as read
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUpdateResponse'
          description: ''
    delete:
      operationId: accounts_notifications_destroy
      description: Deletes the specified notification owned by the authenticated user.
      summary: Delete a notification
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDeleteResponse'
          description: ''
  /accounts/refresh/:
    post:
      operationId: accounts_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /accounts/register/:
    post:
      operationId: accounts_register_create
      description: Creates a new listener account, assigns the Basic subscription
        plan, generates a random display name, creates default user settings, and
        returns the authenticated user together with JWT access and refresh tokens.
      summary: Register a new user
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              RegisterRequest:
                value:
                  username: johndoe
                  email: john@example.com
                  password: StrongPassword123!
                  birth_date: '2000-01-15'
                  gender: MALE
                summary: Register request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                SuccessfulRegistration:
                  value:
                    user:
                      id: 1
                      username: johndoe
                      display_name: johndoe_4821
                      email: john@example.com
                      role: listener
                      profile_picture: null
                      gender: MALE
                      birth_date: '2000-01-15'
                      subscription_type: basic
                      subscription_valid_until: null
                      followers: []
                      following: []
                      created_at: '2026-07-29T12:34:56Z'
                      settings:
                        language: en
                        system_voice: en-is
                        notification_limit: 10
                      listener_profile:
                        playlists: []
                        recently_played: []
                        liked_tracks: []
                        daily_streams: 0
                        last_stream_date: null
                      artist_profile: {}
                    access: <jwt access token>
                    refresh: <jwt refresh token>
                  summary: Successful registration
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterError'
              examples:
                EmailAlreadyExists:
                  value:
                    email:
                    - user with this email already exists.
                  summary: Email already exists
                UsernameAlreadyExists:
                  value:
                    username:
                    - A user with that username already exists.
                  summary: Username already exists
                WeakPassword:
                  value:
                    password:
                    - This password is too short.
                  summary: Weak password
          description: Validation error.
  /albums/:
    get:
      operationId: albums_list
      description: Returns all albums ordered by release date. Supports optional search
        and basic ordering.
      summary: List albums
      parameters:
      - in: query
        name: filter
        schema:
          type: string
          enum:
          - newest
          - oldest
          - stream
        description: '''newest'' orders by newest first, ''oldest'' orders by oldest
          first, ''stream'' orders by listeners when available.'
      - in: query
        name: query
        schema:
          type: string
        description: Case-insensitive search by album title or artist name.
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlbumList'
          description: ''
    post:
      operationId: albums_create
      description: Creates a new album for the authenticated artist. Accepts multipart/form-data
        with an optional cover image upload.
      summary: Create album
      tags:
      - albums
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumCreateRequestRequest'
            examples:
              CreateAlbum:
                value:
                  title: New Album
                  description: My release
                  releaseDate: '2026-07-30T12:00:00Z'
                summary: Create album
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlbumCreateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlbumCreateRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumCreate'
          description: ''
  /albums/{id}/:
    get:
      operationId: albums_retrieve
      description: Returns an album in frontend shape including song list.
      summary: Retrieve an album
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumDetailModel'
          description: ''
    patch:
      operationId: albums_partial_update
      description: Partially updates album metadata and optionally uploads a new cover
        image. Songs cannot be updated through this endpoint. Only the owning artist
        may update.
      summary: Update an album
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlbumUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAlbumUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAlbumUpdateRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumDetailModel'
          description: ''
    delete:
      operationId: albums_destroy
      description: Deletes an album owned by the authenticated artist.
      summary: Delete an album
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /albums/{id}/songs/:
    get:
      operationId: albums_songs_list
      description: Returns the tracks for a given album id in track order.
      summary: List songs of an album
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlbumSong'
          description: ''
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
