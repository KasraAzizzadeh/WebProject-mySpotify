        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Song'
              examples:
                SongList:
                  value:
                  - - id: 12
                      title: Blinding Lights
                      lyrics: '....'
                      duration_ms: 200040
                      track_number: 3
                      streams: 1200000
                      audio_file: /media/songs/blinding.mp3
                      cover_image: /media/album_covers/dawn.jpg
                      release_date: '2026-07-20T12:00:00Z'
                      genre:
